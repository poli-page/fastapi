[project]
name = "poli-page-fastapi-example"
version = "0.1.0"
description = "Interactive demo of poli-page-fastapi"
requires-python = ">=3.11"
dependencies = [
    "poli-page-fastapi",
    "poli-page>=0.11.0,<2",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
# example-app installs poli-page-fastapi from the local source.
poli-page-fastapi = { path = "..", editable = true }
