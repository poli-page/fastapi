[project]
name = "poli-page-fastapi-example"
version = "0.1.0"
description = "Interactive demo of poli-page-fastapi"
requires-python = ">=3.11"
dependencies = [
    "poli-page-fastapi",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
# example-app installs poli-page-fastapi from the local source. poli-page is pinned to
# sdk-python main (as in ../pyproject.toml) until the release from poli-page/sdk-python#11.
poli-page-fastapi = { path = "..", editable = true }
poli-page = { git = "https://github.com/poli-page/sdk-python", rev = "f47d94d78f1d6c14232c7ad8c6522d753041d125" }
