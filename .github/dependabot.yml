version: 2

updates:
  # The package and the example app each have their own uv.lock.
  - package-ecosystem: uv
    directories:
      - "/"
      - "/example-app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Daily: a new API contract version (poli-page/api-contract) arrives as a PR at once.
      interval: daily
    open-pull-requests-limit: 5
    # Dependabot waits 3 days after a release by default. The API contract is
    # exempt so its PR arrives the next day; other actions keep the wait.
    cooldown:
      default-days: 3
      exclude:
        - "poli-page/api-contract"
    groups:
      # The API contract gets PRs of its own: a contract bump shows what the
      # API change breaks, never mixed with other action bumps.
      api-contract:
        patterns:
          - "poli-page/api-contract"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "poli-page/api-contract"
