name: CI
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        fastapi: ["0.100", "0.110"]
        include:
          # FastAPI 0.100 brings Starlette 0.27, whose TestClient passes `app=` to
          # httpx.Client; httpx 0.28 removed that argument.
          - fastapi: "0.100"
            test-pin: "httpx<0.28"
          # The FastAPI and Starlette in uv.lock, what a new install gets.
          - python: "3.13"
            fastapi: "locked"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      # Strict: a failed install fails the job. --locked fails on a stale uv.lock.
      - name: Install
        env:
          TEST_PIN: ${{ matrix.test-pin }}
        run: |
          uv sync --all-extras --locked
          if [ "${{ matrix.fastapi }}" != "locked" ]; then
            uv pip install "fastapi~=${{ matrix.fastapi }}.0" ${TEST_PIN:+"$TEST_PIN"}
          fi
      # Every `uv run` in the package uses --no-sync: a plain `uv run` re-syncs the
      # venv to uv.lock and silently replaces the matrix FastAPI with the locked one.
      - name: FastAPI version under test
        run: uv run --no-sync python -c "import fastapi; print('FastAPI', fastapi.__version__)"
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy src tests example-app/tests
      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0
      - name: Unit tests
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: uv run --no-sync pytest tests/unit -v
      # The example app is its own uv project (its own uv.lock) with the package
      # installed from this checkout.
      - name: Example app install
        working-directory: example-app
        run: |
          uv sync --locked
          uv run python -c "import main; print('example app loads:', main.app.title)"
      - name: Contract tests (example app)
        # tests/test_contract.py runs the contract's impl cases against the example app
        # (with CI set it fails, never skips, when POLI_CONTRACT is missing);
        # tests/test_render_stream.py checks the streamed route's error answers.
        working-directory: example-app
        env:
          CI: "true"
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: |
          test -s "$POLI_CONTRACT" || { echo "::error::API contract file missing: '$POLI_CONTRACT'"; exit 1; }
          uv run pytest -v -rs

  integration:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check for the sandbox API key
        id: key
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
        run: |
          case "$POLI_PAGE_API_KEY" in
            pp_sandbox_*) echo "present=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::POLI_PAGE_API_KEY is not set or is not a pp_sandbox_ key: skipping the live API test."
              echo "present=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v7
        if: steps.key.outputs.present == 'true'
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v7
        if: steps.key.outputs.present == 'true'
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --all-extras
          fi
      - name: Live API test (sandbox key)
        if: steps.key.outputs.present == 'true'
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_BASE_URL: ${{ secrets.POLI_PAGE_BASE_URL }}
        run: |
          # An unset secret expands to an empty string; drop it so the SDK
          # falls back to its default base URL.
          if [ -z "$POLI_PAGE_BASE_URL" ]; then unset POLI_PAGE_BASE_URL; fi
          if [ -d tests/integration ] && [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            uv run pytest tests/integration -v
          else
            echo "Skipping integration tests: no tests/integration/test_*.py yet"
          fi
